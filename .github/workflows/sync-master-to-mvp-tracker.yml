name: Sync master to MVP tracker

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: Discover and report without updating the tracker branch or dispatching CI
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-master-to-mvp-tracker
  cancel-in-progress: false

jobs:
  sync:
    name: Update the MVP tracker branch
    if: github.event_name == 'workflow_dispatch' || vars.MVP_TRACKER_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TRACKER_BRANCH: ${{ vars.MVP_TRACKER_BRANCH || 'chore/review-framework-integration' }}
      SYNC_ENABLED: ${{ vars.MVP_TRACKER_SYNC_ENABLED }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'true' || 'false' }}
      API_VERSION: "2022-11-28"
    steps:
      - name: Discover tracker PR and synchronize branch
        shell: bash
        run: |
          set -Eeuo pipefail

          MODE="push-sync"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${DRY_RUN}" == "true" ]]; then
              MODE="manual-dry-run"
            else
              MODE="manual-sync"
            fi
          fi

          PR_SUMMARY="not discovered"
          BASE_SHA="not resolved"
          EXPECTED_HEAD_SHA="not resolved"
          UPDATE_EXPECTED_HEAD_SHA="not resolved"
          RESULTING_SHA="not resolved"
          CI_DECISION="not evaluated"
          OUTCOME="failed"

          write_summary() {
            local exit_code=$?
            if [[ ${exit_code} -eq 0 ]]; then
              OUTCOME="success"
            fi

            {
              printf '## MVP tracker synchronization\n\n'
              printf -- '- **Outcome:** `%s`\n' "${OUTCOME}"
              printf -- '- **Mode:** `%s`\n' "${MODE}"
              printf -- '- **Pull request:** %s\n' "${PR_SUMMARY}"
              printf -- '- **Base SHA:** `%s`\n' "${BASE_SHA}"
              printf -- '- **Expected head SHA:** `%s`\n' "${EXPECTED_HEAD_SHA}"
              printf -- '- **Resulting tracker SHA:** `%s`\n' "${RESULTING_SHA}"
              printf -- '- **CI decision:** %s\n' "${CI_DECISION}"
            } >> "${GITHUB_STEP_SUMMARY}"
          }
          trap write_summary EXIT

          fail() {
            printf '::error::%s\n' "$1"
            exit 1
          }

          if [[ "${DRY_RUN}" != "true" && "${SYNC_ENABLED}" != "true" ]]; then
            fail "Mutating synchronization requires MVP_TRACKER_SYNC_ENABLED to be exactly true."
          fi

          api_get() {
            local path=$1
            curl --silent --show-error --fail-with-body \
              --retry 2 \
              --retry-all-errors \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: ${API_VERSION}" \
              "${GITHUB_API_URL}${path}"
          }

          api_post_expect_204() {
            local path=$1
            local body=$2
            local response_file="${RUNNER_TEMP}/mvp-tracker-post-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            local status

            if ! status=$(curl --silent --show-error \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: ${API_VERSION}" \
              --header "Content-Type: application/json" \
              --data "${body}" \
              "${GITHUB_API_URL}${path}"); then
              fail "GitHub API POST request failed."
            fi

            if [[ "${status}" != "204" ]]; then
              local message
              message=$(jq -r '.message // "unknown API error"' "${response_file}" 2>/dev/null || printf 'unknown API error')
              fail "GitHub API POST returned HTTP ${status}: ${message}"
            fi
          }

          validate_pr() {
            local pr_json=$1
            jq -e \
              --arg repository "${REPOSITORY}" \
              --arg tracker_branch "${TRACKER_BRANCH}" \
              '(.state == "open") and
               (.draft == true) and
               (.base.ref == "master") and
               (.head.ref == $tracker_branch) and
               (.head.repo.full_name == $repository) and
               any(.labels[]?; .name == "release:mvp-tracker")' \
              <<< "${pr_json}" >/dev/null
          }

          compare_shas() {
            local base_sha=$1
            local head_sha=$2
            api_get "/repos/${REPOSITORY}/compare/${base_sha}...${head_sha}"
          }

          get_master_sha() {
            api_get "/repos/${REPOSITORY}/git/ref/heads/master" | jq -er '.object.sha'
          }

          get_pr() {
            local pr_number=$1
            api_get "/repos/${REPOSITORY}/pulls/${pr_number}"
          }

          get_ci_runs() {
            local head_sha=$1
            api_get "/repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${head_sha}&per_page=100"
          }

          OWNER=${REPOSITORY%%/*}
          [[ -n "${OWNER}" && "${REPOSITORY}" == */* ]] || fail "Invalid repository identifier."
          [[ -n "${TRACKER_BRANCH}" ]] || fail "MVP tracker branch must not be empty."

          encoded_head=$(jq -nr \
            --arg value "${OWNER}:${TRACKER_BRANCH}" \
            '$value | @uri')
          candidates=$(api_get "/repos/${REPOSITORY}/pulls?state=open&base=master&head=${encoded_head}&per_page=100")

          matches=$(jq -c \
            --arg repository "${REPOSITORY}" \
            --arg tracker_branch "${TRACKER_BRANCH}" \
            '[.[] |
              select(.state == "open") |
              select(.draft == true) |
              select(.base.ref == "master") |
              select(.head.ref == $tracker_branch) |
              select(.head.repo.full_name == $repository) |
              select(any(.labels[]?; .name == "release:mvp-tracker"))]' \
            <<< "${candidates}")
          match_count=$(jq -er 'length' <<< "${matches}")
          [[ "${match_count}" == "1" ]] || fail "Expected exactly one open draft MVP tracker PR; found ${match_count}."

          pr=$(jq -c '.[0]' <<< "${matches}")
          validate_pr "${pr}" || fail "The discovered pull request no longer matches the MVP tracker contract."

          PR_NUMBER=$(jq -er '.number' <<< "${pr}")
          PR_URL=$(jq -er '.html_url' <<< "${pr}")
          EXPECTED_HEAD_SHA=$(jq -er '.head.sha' <<< "${pr}")
          UPDATE_EXPECTED_HEAD_SHA="${EXPECTED_HEAD_SHA}"
          PR_SUMMARY="[#${PR_NUMBER}](${PR_URL})"
          BASE_SHA=$(get_master_sha)
          RESULTING_SHA="${EXPECTED_HEAD_SHA}"

          initial_compare=$(compare_shas "${BASE_SHA}" "${EXPECTED_HEAD_SHA}")
          initial_behind=$(jq -er '.behind_by' <<< "${initial_compare}")

          if [[ "${DRY_RUN}" == "true" ]]; then
            runs=$(get_ci_runs "${RESULTING_SHA}")
            active_count=$(jq -er '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length' <<< "${runs}")
            successful_count=$(jq -er '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length' <<< "${runs}")
            unsuccessful_count=$(jq -er '[.workflow_runs[] | select(.status == "completed" and .conclusion != "success")] | length' <<< "${runs}")

            if (( active_count > 0 )); then
              run_id=$(jq -er '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")][0].id' <<< "${runs}")
              CI_DECISION="active run ${run_id} exists; no dispatch in dry-run mode"
            elif (( successful_count > 0 )); then
              run_id=$(jq -er '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")][0].id' <<< "${runs}")
              CI_DECISION="successful completed run ${run_id} exists; no dispatch in dry-run mode"
            elif (( unsuccessful_count > 0 )); then
              CI_DECISION="only unsuccessful completed runs exist; ci.yml would be dispatched for a retry after synchronization"
            else
              CI_DECISION="no queued, in-progress, or completed run found; ci.yml would be dispatched after synchronization"
            fi
            printf 'Dry run: tracker is %s commit(s) behind master.\n' "${initial_behind}"
            exit 0
          fi

          if (( initial_behind > 0 )); then
            update_response_file="${RUNNER_TEMP}/mvp-tracker-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            update_accepted=false

            for attempt in 1 2; do
              update_body=$(jq -cn --arg expected_head_sha "${UPDATE_EXPECTED_HEAD_SHA}" '{expected_head_sha: $expected_head_sha}')
              if ! update_status=$(curl --silent --show-error \
                --output "${update_response_file}" \
                --write-out '%{http_code}' \
                --request PUT \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: ${API_VERSION}" \
                --header "Content-Type: application/json" \
                --data "${update_body}" \
                "${GITHUB_API_URL}/repos/${REPOSITORY}/pulls/${PR_NUMBER}/update-branch"); then
                fail "The update-branch API request failed."
              fi

              if [[ "${update_status}" == "202" ]]; then
                update_accepted=true
                break
              fi

              refreshed_pr=$(get_pr "${PR_NUMBER}")
              validate_pr "${refreshed_pr}" || fail "The tracker PR changed while synchronization was in progress."
              refreshed_head_sha=$(jq -er '.head.sha' <<< "${refreshed_pr}")
              refreshed_base_sha=$(get_master_sha)
              refreshed_compare=$(compare_shas "${refreshed_base_sha}" "${refreshed_head_sha}")
              refreshed_behind=$(jq -er '.behind_by' <<< "${refreshed_compare}")

              if (( refreshed_behind == 0 )); then
                BASE_SHA="${refreshed_base_sha}"
                RESULTING_SHA="${refreshed_head_sha}"
                update_accepted=true
                break
              fi

              if [[ "${refreshed_head_sha}" != "${UPDATE_EXPECTED_HEAD_SHA}" && ${attempt} -eq 1 ]]; then
                UPDATE_EXPECTED_HEAD_SHA="${refreshed_head_sha}"
                BASE_SHA="${refreshed_base_sha}"
                printf 'Tracker head changed concurrently; retrying once with the refreshed SHA.\n'
                continue
              fi

              api_message=$(jq -r '.message // "unknown API error"' "${update_response_file}" 2>/dev/null || printf 'unknown API error')
              if [[ "${update_status}" == "409" || "${update_status}" == "422" ]]; then
                fail "Tracker update was rejected without a recoverable stale-head race (likely merge conflict): ${api_message}"
              fi
              fail "Tracker update failed with HTTP ${update_status}: ${api_message}"
            done

            [[ "${update_accepted}" == "true" ]] || fail "Tracker update was not accepted after the bounded retry."
          else
            printf 'Tracker branch is already up to date with master.\n'
          fi

          synchronized=false
          for poll_attempt in $(seq 1 12); do
            current_pr=$(get_pr "${PR_NUMBER}")
            validate_pr "${current_pr}" || fail "The tracker PR changed while waiting for synchronization."
            current_head_sha=$(jq -er '.head.sha' <<< "${current_pr}")
            current_base_sha=$(get_master_sha)
            current_compare=$(compare_shas "${current_base_sha}" "${current_head_sha}")
            current_behind=$(jq -er '.behind_by' <<< "${current_compare}")

            if (( current_behind == 0 )); then
              BASE_SHA="${current_base_sha}"
              RESULTING_SHA="${current_head_sha}"
              synchronized=true
              break
            fi

            if (( poll_attempt < 12 )); then
              sleep 5
            fi
          done
          [[ "${synchronized}" == "true" ]] || fail "Timed out waiting for the tracker branch to become current with master."

          existing_run=false
          DISPATCH_REASON="no queued, in-progress, or successful completed run found"
          for ci_poll_attempt in $(seq 1 12); do
            runs=$(get_ci_runs "${RESULTING_SHA}")
            active_count=$(jq -er '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length' <<< "${runs}")
            successful_count=$(jq -er '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length' <<< "${runs}")
            unsuccessful_count=$(jq -er '[.workflow_runs[] | select(.status == "completed" and .conclusion != "success")] | length' <<< "${runs}")

            if (( active_count > 0 )); then
              run_id=$(jq -er '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")][0].id' <<< "${runs}")
              run_status=$(jq -er --argjson run_id "${run_id}" '.workflow_runs[] | select(.id == $run_id) | .status' <<< "${runs}")
              CI_DECISION="existing run ${run_id} (${run_status}); dispatch skipped"
              existing_run=true
              break
            fi

            if (( successful_count > 0 )); then
              run_id=$(jq -er '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")][0].id' <<< "${runs}")
              CI_DECISION="successful completed run ${run_id}; dispatch skipped"
              existing_run=true
              break
            fi

            if (( unsuccessful_count > 0 )); then
              DISPATCH_REASON="only unsuccessful completed runs were found"
              break
            fi

            if (( ci_poll_attempt < 12 )); then
              sleep 5
            fi
          done

          if [[ "${existing_run}" == "false" ]]; then
            dispatch_pr=$(get_pr "${PR_NUMBER}")
            validate_pr "${dispatch_pr}" || fail "The tracker PR changed before CI dispatch."
            dispatch_head_sha=$(jq -er '.head.sha' <<< "${dispatch_pr}")
            [[ "${dispatch_head_sha}" == "${RESULTING_SHA}" ]] || fail "The tracker head changed before CI dispatch; refusing to test a stale SHA."

            dispatch_body=$(jq -cn \
              --arg ref "${TRACKER_BRANCH}" \
              --arg target_sha "${RESULTING_SHA}" \
              '{ref: $ref, inputs: {target_sha: $target_sha}}')
            api_post_expect_204 "/repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" "${dispatch_body}"
            CI_DECISION="ci.yml dispatched on ${TRACKER_BRANCH} for ${RESULTING_SHA}; ${DISPATCH_REASON}"
          fi

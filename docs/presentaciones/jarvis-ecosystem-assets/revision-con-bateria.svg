<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title desc">
  <title id="title">La atención humana también tiene límites</title>
  <desc id="desc">Arriba, una revisora agotada al final del día se enfrenta a una montaña de cambios. Abajo, examina un paquete coherente de comportamiento, pruebas y documentación; otros paquetes esperan su turno.</desc>

# Docker Compose for local development and staging.
# Do not use this file for production. Production should provide secrets through
# a real secret manager such as Vault or AWS Secrets Manager.
#
# Usage:
#   docker compose -f hive-api/deploy/docker-compose.yml up --build
#   docker compose -f hive-api/deploy/docker-compose.yml down -v  (also removes volumes)

services:
  # ============================================================
  # PostgreSQL 15
  # ============================================================
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_postgres_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-hivedb}
    ports:
      - "5432:5432"
    volumes:
      # Named volume: data persists across container restarts.
      # "docker compose down" keeps it; "docker compose down -v" removes it.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready verifies that PostgreSQL accepts connections before api starts.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hive} -d ${POSTGRES_DB:-hivedb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # hive-api
  # ============================================================
  api:
    build:
      context: ../..        # repository root context includes hive-api/ and hive-dashboard/
      dockerfile: hive-api/deploy/Dockerfile
      args:
        TARGETOS: ${TARGETOS:-linux}
        TARGETARCH: ${TARGETARCH:-amd64}
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hive}:${POSTGRES_PASSWORD:-example_postgres_password_change_me}@postgres:5432/${POSTGRES_DB:-hivedb}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required and must be at least 32 characters}
      PORT: "8080"
      GIN_MODE: ${GIN_MODE:-release}
    depends_on:
      postgres:
        # Start api only after the postgres healthcheck passes.
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
